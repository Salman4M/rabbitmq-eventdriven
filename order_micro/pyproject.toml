[project]
name = "order-micro"
version = "0.1.0"
description = "Add your description here"
# readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.17.0",
    "fastapi[standard]>=0.119.0",
    "httpx>=0.28.1",
    "pika>=1.3.2",
    "psycopg[binary]>=3.2.10",
    "pydantic>=2.12.3",
    "python-decouple>=3.8",
    "sqlalchemy>=2.0.44",
    "uvicorn[standard]>=0.38.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=7.4.3",
    "httpx>=0.28.1",
]
