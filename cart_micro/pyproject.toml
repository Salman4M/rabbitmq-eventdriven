[project]
name = "cart-micro"
version = "0.1.0"
description = "Shopping cart microservice"
# readme = "README.md"  # ✅ COMMENTED OUT - file doesn't exist
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.17.0",
    "fastapi[standard]>=0.119.0",
    "pika>=1.3.2",
    "pydantic>=2.12.3",
    "psycopg[binary]>=3.1.0",
    "python-decouple>=3.8",
    "sqlalchemy>=2.0.44",
    "uvicorn[standard]>=0.37.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=7.4.3",
    "httpx>=0.27.0",
]